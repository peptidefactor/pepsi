<!-- 1. 引入 EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
  (function(){
      // TODO: 请将下面的 YOUR_PUBLIC_KEY 替换为你自己的 Public Key
      emailjs.init("YOUR_PUBLIC_KEY");
  })();
</script>

<!-- 2. 结算与地址填写组件 -->
<div class="checkout-container" style="max-width:600px; margin:20px auto; padding:20px; border:1px solid #ddd; border-radius:8px; background:#fff;">
    <h3 style="margin-top:0; color:#0a2540;">Shipping & Crypto Payment Information</h3>
    
    <!-- 客户基本信息 -->
    <div style="margin-bottom:15px;">
        <label style="font-weight:600;">Full Name *</label>
        <input type="text" id="cust_name" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" required>
    </div>
    
    <div style="margin-bottom:15px;">
        <label style="font-weight:600;">Email Address *</label>
        <input type="email" id="cust_email" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" required>
    </div>

    <div style="margin-bottom:15px;">
        <label style="font-weight:600;">WhatsApp / Telegram *</label>
        <input type="text" id="cust_phone" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" required>
    </div>

    <div style="margin-bottom:15px;">
        <label style="font-weight:600;">Detailed Shipping Address *</label>
        <textarea id="cust_address" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" rows="3" required></textarea>
    </div>

    <!-- 虚拟货币选择区 -->
    <div style="margin-bottom:15px;">
        <label style="font-weight:600;">Select Crypto Payment Method *</label>
        <select id="payment_method" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" onchange="toggleWalletAddress()">
            <option value="USDT-TRC20">USDT (TRC20 - Tron Network)</option>
            <option value="USDT-ERC20">USDT (ERC20 - Ethereum Network)</option>
            <option value="BTC">Bitcoin (BTC)</option>
        </select>
    </div>

    <!-- 钱包地址展示框 -->
    <div id="wallet_box" style="background:#f8f9fa; padding:15px; border:1px dashed #00d4b2; border-radius:6px; margin-bottom:15px; word-break:break-all;">
        <strong style="color:#0a2540;">Send Payment To:</strong>
        <p id="wallet_address" style="font-family:monospace; color:#007bff; margin:8px 0; font-weight:bold; font-size:15px;">
            <!-- TODO: 替换为你的真实 TRC20 钱包地址 -->
            YOUR_TRC20_WALLET_ADDRESS_HERE
        </p>
        <small style="color:#666;">Please transfer the exact total amount in USD equivalent.</small>
    </div>

    <div style="margin-bottom:20px;">
        <label style="font-weight:600;">Transaction ID / Hash (Optional)</label>
        <input type="text" id="txid" placeholder="Paste TxID after payment" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
    </div>

    <button onclick="submitCryptoOrder()" style="width:100%; padding:14px; background:#25D366; color:white; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer; transition:0.3s;">
        Submit Order & Send Details
    </button>
</div>

<!-- 3. 业务逻辑 JavaScript -->
<script>
// 切换币种展示对应的钱包地址
function toggleWalletAddress() {
    var method = document.getElementById('payment_method').value;
    var addrEl = document.getElementById('wallet_address');
    
    // TODO: 将下方引号中的地址替换为你真实的收款地址
    if (method === 'USDT-TRC20') {
        addrEl.textContent = "YOUR_TRC20_WALLET_ADDRESS_HERE";
    } else if (method === 'USDT-ERC20') {
        addrEl.textContent = "YOUR_ERC20_WALLET_ADDRESS_HERE";
    } else if (method === 'BTC') {
        addrEl.textContent = "YOUR_BTC_WALLET_ADDRESS_HERE";
    }
}

// 提交订单并发送邮件
function submitCryptoOrder() {
    var name = document.getElementById('cust_name').value.trim();
    var email = document.getElementById('cust_email').value.trim();
    var phone = document.getElementById('cust_phone').value.trim();
    var address = document.getElementById('cust_address').value.trim();

    if (!name || !email || !phone || !address) {
        alert("Please fill in all required shipping fields!");
        return;
    }

    var cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    var orderSummary = cart.map(function(item) {
        return `${item.name} (${item.variant || 'Standard'}) x ${item.quantity} - $${(item.price * item.quantity).toFixed(2)}`;
    }).join("\n");

    var total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0).toFixed(2);

    var templateParams = {
        customer_name: name,
        customer_email: email,
        customer_phone: phone,
        shipping_address: address,
        payment_method: document.getElementById('payment_method').value,
        txid: document.getElementById('txid').value || "Not provided",
        order_items: orderSummary,
        total_price: total
    };

    // TODO: 请将 'YOUR_SERVICE_ID' 替换为你的 EmailJS Service ID
    emailjs.send('YOUR_SERVICE_ID', 'template_g2vs11k', templateParams)
        .then(function(response) {
            alert('Order submitted successfully! We will verify your crypto payment and contact you shortly.');
            localStorage.removeItem('peptides_cart'); // 清空购物车
            window.location.reload(); // 重新加载或跳转
        }, function(error) {
            alert('Failed to send order. Please contact us via WhatsApp or Telegram directly.');
            console.log('EmailJS Error:', error);
        });
}
</script>
