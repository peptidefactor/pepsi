<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Shopping Cart & Checkout | Peptides Factory</title>
    
    <link rel="canonical" href="https://peptidefactor.github.io/pepper/cart.html" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- 引入 EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function(){
            emailjs.init("M3-npsUuG0wBf8Ltd");
        })();
    </script>

    <style>
        :root {
            --primary-color: #0a2540;
            --accent-color: #00d4b2;
            --text-dark: #333;
            --bg-light: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            color: var(--text-dark);
            background-color: #fff;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%; 
            border-bottom: 1px solid #eee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-img {
            height: 90px; 
            width: auto;
            object-fit: contain;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: 0.3s;
        }
        nav a:hover { color: var(--accent-color); }

        .cart-container { 
            max-width: 1200px; 
            margin: 40px auto; 
            padding: 0 20px; 
            min-height: 400px;
        }
        .cart-title { 
            color: var(--primary-color); 
            font-size: 32px; 
            margin-bottom: 30px; 
            border-bottom: 2px solid #eee; 
            padding-bottom: 10px; 
        }

        /* 左右双栏结构 */
        .cart-layout {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .cart-left-table {
            flex: 1;
            min-width: 320px;
        }
        .checkout-right-form {
            width: 420px;
            min-width: 320px;
            background: var(--bg-light);
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .cart-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 20px; 
        }
        .cart-table th { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 15px; 
            text-align: left; 
            font-size: 15px;
        }
        .cart-table td { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            vertical-align: middle; 
        }
        
        .item-image { 
            width: 60px; 
            height: 60px; 
            object-fit: contain; 
            background: #f0f0f0; 
            border-radius: 6px; 
            padding: 4px; 
        }
        .item-details { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        .item-name { 
            font-weight: bold; 
            color: var(--primary-color); 
            font-size: 15px; 
        }
        .item-spec { 
            color: #666; 
            font-size: 13px; 
            margin-top: 3px; 
        }

        .qty-control {
            display: flex;
            align-items: center;
        }
        .qty-btn { 
            background: #eee; 
            border: none; 
            padding: 4px 10px; 
            cursor: pointer; 
            font-size: 14px; 
            border-radius: 4px; 
            font-weight: bold;
            transition: 0.2s;
        }
        .qty-btn:hover { background: #ddd; }
        .qty-input { 
            width: 35px; 
            text-align: center; 
            border: 1px solid #ddd; 
            padding: 4px; 
            margin: 0 4px; 
            border-radius: 4px; 
            font-size: 14px; 
        }

        .delete-btn { 
            background: none; 
            border: none; 
            color: #ff4d4d; 
            cursor: pointer; 
            font-size: 16px; 
            transition: 0.3s; 
        }
        .delete-btn:hover { 
            color: #cc0000; 
            transform: scale(1.1); 
        }

        /* 结算表单样式 */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .wallet-card {
            background: #fff;
            border: 1px dashed var(--accent-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .submit-btn { 
            background-color: #25D366; 
            color: white; 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px; 
        }
        .submit-btn:hover { 
            background-color: #1ebd59; 
            box-shadow: 0 4px 12px rgba(37,211,102,0.3);
        }

        .empty-msg { 
            text-align: center; 
            padding: 60px 0; 
        }
        .empty-msg i { 
            font-size: 60px; 
            color: #ccc; 
            margin-bottom: 20px; 
        }
        .empty-msg p { 
            font-size: 18px; 
            color: #666; 
            margin-bottom: 25px; 
        }
        .shop-link { 
            display: inline-block; 
            background-color: var(--primary-color); 
            color: white; 
            padding: 12px 30px; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        .shop-link:hover { 
            background-color: var(--accent-color); 
            color: var(--primary-color); 
        }

        footer { 
            background-color: #0d1117; 
            color: #9ca3af; 
            padding: 40px 5% 20px; 
            font-size: 14px; 
            text-align: center; 
            margin-top: 80px; 
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#shop">Shop</a>
        </nav>
    </header>

    <div class="cart-container">
        <h1 class="cart-title">Your Shopping Cart & Direct Checkout</h1>
        <div id="cart-content"></div>
    </div>

    <footer>
        <div>Copyright © 2026 Peptides Factory. All Rights Reserved.</div>
    </footer>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
            const container = document.getElementById('cart-content');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-msg">
                        <i class="fas fa-shopping-basket"></i>
                        <p>Your shopping cart is empty.</p>
                        <a href="index.html#shop" class="shop-link">Return to Shop</a>
                    </div>
                `;
                return;
            }
            
            let subtotal = 0;
            let tableRows = '';
            
            cart.forEach((item, index) => {
                let itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                tableRows += `
                    <tr>
                        <td>
                            <div class="item-details">
                                <img src="${item.image}" alt="${item.name}" class="item-image">
                                <div>
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-spec">Spec: ${item.spec}</div>
                                </div>
                            </div>
                        </td>
                        <td>$${item.price.toFixed(2)}</td>
                        <td>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                                <input type="text" class="qty-input" value="${item.quantity}" readonly>
                                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                            </div>
                        </td>
                        <td>$${itemTotal.toFixed(2)}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteItem(${index})">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            // 双栏并排 HTML
            container.innerHTML = `
                <div class="cart-layout">
                    <!-- 左栏：商品明细与总计 -->
                    <div class="cart-left-table">
                        <table class="cart-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Price</th>
                                    <th>Quantity</th>
                                    <th>Total</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>

                        <div style="text-align: right; padding: 15px; background: #fdfdfd; border-radius: 8px; border: 1px solid #eee;">
                            <p style="margin: 5px 0; color: #666;">Subtotal: <strong style="color: #333;">$${subtotal.toFixed(2)}</strong></p>
                            <p style="margin: 5px 0; color: #666;">Shipping: <strong style="color: #25D366;">Free Stealth Shipping</strong></p>
                            <h3 style="margin: 10px 0 0 0; color: var(--primary-color);">Total: $${subtotal.toFixed(2)}</h3>
                        </div>
                    </div>

                    <!-- 右栏：加密货币直接结算表单 -->
                    <div class="checkout-right-form">
                        <h3 style="margin-top:0; color:var(--primary-color); font-size:18px;">Shipping & Crypto Payment</h3>
                        
                        <form id="direct-checkout-form" onsubmit="event.preventDefault(); submitDirectCryptoOrder();">
                            <div class="form-group">
                                <label>Full Name *</label>
                                <input type="text" id="cust_name" placeholder="John Doe" required>
                            </div>

                            <div class="form-group">
                                <label>Email Address *</label>
                                <input type="email" id="cust_email" placeholder="john@example.com" required>
                            </div>

                            <div class="form-group">
                                <label>WhatsApp / Telegram *</label>
                                <input type="text" id="cust_phone" placeholder="+1 234 567 8900" required>
                            </div>

                            <div class="form-group">
                                <label>Detailed Shipping Address *</label>
                                <textarea id="cust_address" rows="3" placeholder="Full street address, city, state, zip code, country" required></textarea>
                            </div>

                            <div class="form-group">
                                <label>Crypto Payment Method *</label>
                                <select id="payment_method" onchange="toggleWalletAddress()">
                                    <option value="USDT-TRC20">USDT (TRC20 - Tron Network)</option>
                                    <option value="USDT-ERC20">USDT (ERC20 - Ethereum Network)</option>
                                    <option value="BTC">Bitcoin (BTC)</option>
                                </select>
                            </div>

                            <!-- 钱包地址展示卡片 -->
                            <div class="wallet-card">
                                <span style="font-size:12px; color:#666;">Send exact amount to address:</span>
                                <p id="wallet_address" style="font-family:monospace; color:#007bff; font-size:13px; font-weight:bold; margin:6px 0 0 0;">
                                    TB9Cr786LZDYdYNqYHZGExbx4oGYqGMiWj
                                </p>
                            </div>

                            <div class="form-group">
                                <label>TxID / Hash (Optional)</label>
                                <input type="text" id="txid" placeholder="Paste transaction hash if paid">
                            </div>

                            <button type="submit" class="submit-btn">
                                Complete & Submit Order
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }
        
        // 动态切换收款钱包地址
        function toggleWalletAddress() {
            var method = document.getElementById('payment_method').value;
            var addrEl = document.getElementById('wallet_address');
            
            if (method === 'USDT-TRC20') {
                addrEl.textContent = "TB9Cr786LZDYdYNqYHZGExbx4oGYqGMiWj";
            } else if (method === 'USDT-ERC20') {
                addrEl.textContent = "0xFC8e55dc3C29e2A5895dFC96A9B0703684518574";
            } else if (method === 'BTC') {
                addrEl.textContent = "bc1pqcvdkrk3xre984068cr79ekxm7g0trf9cnqasf3jkp8k4ar47x8q9hc3zg";
            }
        }

        // 提交订单至 EmailJS
        function submitDirectCryptoOrder() {
            let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            var orderSummary = cart.map(function(item) {
                return `${item.name} (${item.spec || 'Standard'}) x ${item.quantity} - $${(item.price * item.quantity).toFixed(2)}`;
            }).join("\n");

            var total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0).toFixed(2);

            var templateParams = {
                customer_name: document.getElementById('cust_name').value.trim(),
                customer_email: document.getElementById('cust_email').value.trim(),
                customer_phone: document.getElementById('cust_phone').value.trim(),
                shipping_address: document.getElementById('cust_address').value.trim(),
                payment_method: document.getElementById('payment_method').value,
                txid: document.getElementById('txid').value.trim() || "Not provided",
                order_items: orderSummary,
                total_price: total
            };

            // 使用 service_gmail 作为默认 Service ID 结合 template_g2vs11k 提交
            emailjs.send('service_gmail', 'template_g2vs11k', templateParams)
                .then(function(response) {
                    alert('Order submitted successfully! We will verify payment and contact you shortly.');
                    localStorage.removeItem('peptides_cart');
                    loadCart();
                }, function(error) {
                    alert('Failed to send order. Please contact us via WhatsApp / Telegram directly.');
                    console.error('EmailJS Error:', error);
                });
        }

        function updateQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
            cart[index].quantity += change;
            
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            
            localStorage.setItem('peptides_cart', JSON.stringify(cart));
            loadCart();
        }
        
        function deleteItem(index) {
            let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('peptides_cart', JSON.stringify(cart));
            loadCart();
        }
        
        loadCart();
    </script>
</body>
</html>
