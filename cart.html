<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart & Checkout - PeptidesFactoryCN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #25d366;
            --accent-hover: #1da851;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 2px solid var(--border-color);
        }

        header h1 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }

        .cart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 768px) {
            .cart-grid {
                grid-template-columns: 1.2fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .card-title span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Cart Items Table */
        .cart-table, .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .cart-table th, .order-table th {
            text-align: left;
            padding: 10px;
            font-size: 13px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
        }

        .cart-table td, .order-table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .qty-input {
            width: 50px;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: center;
        }

        .remove-btn {
            color: #ef4444;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }

        .summary-row.total {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary-color);
            border-top: 2px solid var(--border-color);
            padding-top: 12px;
            margin-top: 10px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #3b82f6;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        .notice-box {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 15px;
        }

        .empty-cart-msg, .empty-order-msg {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .admin-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .admin-toggle-btn:hover {
            background: var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PeptidesFactoryCN 订单结算</h1>
        <p>仅供研究使用 (RUO) 的试剂和实验室用品</p>
    </header>

    <div class="cart-grid">
        <!-- 左侧：购物车及金额汇总 -->
        <div class="card">
            <div class="card-title">
                <span><i class="fas fa-shopping-cart"></i> 您的购物车</span>
            </div>
            <div id="cart-content">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>物品</th>
                            <th>价格</th>
                            <th>数量</th>
                            <th>小计</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-items-body">
                        <!-- 动态生成购物车商品 -->
                    </tbody>
                </table>

                <div class="summary-row">
                    <span>商品小计</span>
                    <span id="subtotal-val">$0.00美元</span>
                </div>
                <div class="summary-row">
                    <span>预计运费</span>
                    <span id="shipping-val">$0.00美元</span>
                </div>
                <div class="summary-row total">
                    <span>订单总计</span>
                    <span id="grand-total-val">$0.00美元</span>
                </div>
            </div>
        </div>

        <!-- 右侧：配送及订单详情表单 -->
        <div class="card">
            <div class="card-title">
                <span><i class="fas fa-shipping-fast"></i> 配送及订单详情</span>
            </div>
            <form id="checkout-form" onsubmit="event.preventDefault(); submitDirectCryptoOrder();">
                <div class="form-group">
                    <label for="fullName">全名 *</label>
                    <input type="text" id="fullName" required placeholder="John Doe">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">电子邮件地址 *</label>
                        <input type="email" id="email" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="phone">电话 / WhatsApp *</label>
                        <input type="tel" id="phone" required placeholder="+1 234 567 8900">
                    </div>
                </div>

                <div class="form-group">
                    <label for="country">国家/地区 *</label>
                    <select id="country" required onchange="updateShippingCost()">
                        <option value="">选择国家/地区...</option>
                        <option value="United States">United States (美国)</option>
                        <option value="Canada">Canada (加拿大)</option>
                        <option value="United Kingdom">United Kingdom (英国)</option>
                        <option value="Australia">Australia (澳大利亚)</option>
                        <option value="Germany">Germany (德国)</option>
                        <option value="France">France (法国)</option>
                        <option value="Other">Other International Destination (其他国际目的地)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">收件地址 *</label>
                    <textarea id="address" rows="2" required placeholder="街道地址、公寓、套房等。"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">城市 *</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label for="zipCode">邮政编码 *</label>
                        <input type="text" id="zipCode" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="paymentMethod">付款偏好 *</label>
                    <select id="paymentMethod" required>
                        <option value="USDT (TRC20)">USDT (TRC20)</option>
                        <option value="USDT (ERC20)">USDT (ERC20)</option>
                        <option value="Bitcoin (BTC)">Bitcoin (BTC)</option>
                        <option value="Bank Transfer / Wire">Bank Transfer / Wire (银行电汇)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="txid">交易哈希 / 交易 ID (可选)</label>
                    <input type="text" id="txid" placeholder="如果已付款，请粘贴交易ID；否则留空。">
                </div>

                <div class="form-group">
                    <label for="notes">特殊说明 / 订单备注</label>
                    <textarea id="notes" rows="2" placeholder="定制包装要求、隐蔽包装要求等。"></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn-text">
                    <i class="fab fa-whatsapp"></i> 通过 WhatsApp 提交订单
                </button>

                <div class="notice-box">
                    <i class="fas fa-info-circle"></i> 点击提交后，将打开 WhatsApp 并预填您的订单摘要。系统会同时在本地保存订单备份，防止漏单。
                </div>
            </form>
        </div>
    </div>

    <!-- 底部：管理员历史订单查看区域 -->
    <div class="card">
        <div class="card-title">
            <span><i class="fas fa-history"></i> 本地历史订单备份 (防漏单管理)</span>
            <button class="admin-toggle-btn" onclick="toggleAdminView()">切换查看</button>
        </div>
        <div id="admin-orders-container" style="display: none;">
            <div id="order-list-content">
                <!-- 动态填充历史订单 -->
            </div>
            <div style="text-align: right; margin-top: 15px;">
                <button class="remove-btn" style="background:#ef4444; color:#fff; padding:6px 12px; border-radius:4px; font-size:13px;" onclick="clearOrderHistory()">清空历史订单记录</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ⚠️ 请在此处修改为您的真实 WhatsApp 号码（国家代码 + 号码，不带 + 号或空格）
    const WHATSAPP_NUMBER = "8618000000000";

    let currentSubtotal = 0;
    let calculatedShipping = 0;

    // 页面初始化时加载购物车
    document.addEventListener("DOMContentLoaded", function () {
        renderCart();
        renderOrderHistory();
    });

    function renderCart() {
        let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
        const tbody = document.getElementById('cart-items-body');
        tbody.innerHTML = '';

        if (cart.length === 0) {
            document.getElementById('cart-content').innerHTML = '<div class="empty-cart-msg">您的购物车是空的。请先添加商品。</div>';
            document.getElementById('subtotal-val').innerText = '$0.00美元';
            document.getElementById('shipping-val').innerText = '$0.00美元';
            document.getElementById('grand-total-val').innerText = '$0.00美元';
            return;
        }

        currentSubtotal = 0;

        cart.forEach((item, index) => {
            const itemTotal = item.price * item.qty;
            currentSubtotal += itemTotal;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td>$${item.price.toFixed(2)}美元</td>
                <td>
                    <input type="number" class="qty-input" value="${item.qty}" min="1" onchange="updateQuantity(${index}, this.value)">
                </td>
                <td>$${itemTotal.toFixed(2)}美元</td>
                <td><button class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash-alt"></i></button></td>
            `;
            tbody.appendChild(tr);
        });

        updateShippingCost();
    }

    function updateQuantity(index, newQty) {
        let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
        const qty = parseInt(newQty);
        if (qty > 0) {
            cart[index].qty = qty;
            localStorage.setItem('peptides_cart', JSON.stringify(cart));
            renderCart();
        }
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('peptides_cart', JSON.stringify(cart));
        location.reload();
    }

    function updateShippingCost() {
        let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
        if (cart.length === 0) {
            calculatedShipping = 0;
        } else if (currentSubtotal >= 300) {
            calculatedShipping = 0; // 满300美元免运费
        } else {
            calculatedShipping = 40.00; // 300美元以下运费40美元
        }

        document.getElementById('subtotal-val').innerText = `$${currentSubtotal.toFixed(2)}美元`;
        document.getElementById('shipping-val').innerText = calculatedShipping === 0 ? "免运费" : `$${calculatedShipping.toFixed(2)}美元`;
        
        const grandTotal = currentSubtotal + calculatedShipping;
        document.getElementById('grand-total-val').innerText = `$${grandTotal.toFixed(2)}美元`;
    }

    // 切换管理员历史订单查看（加个简单密码）
    function toggleAdminView() {
        const container = document.getElementById('admin-orders-container');
        if (container.style.display === 'none') {
            const pwd = prompt("请输入管理员查看密码 (默认直接点确定或输入密码):");
            // 你可以自行修改密码逻辑，这里默认直接允许查看
            container.style.display = 'block';
            renderOrderHistory();
        } else {
            container.style.display = 'none';
        }
    }

    // 渲染历史订单列表
    function renderOrderHistory() {
        let orders = JSON.parse(localStorage.getItem('peptides_order_history')) || [];
        const contentDiv = document.getElementById('order-list-content');
        
        if (orders.length === 0) {
            contentDiv.innerHTML = '<div class="empty-order-msg">暂无历史提交订单记录。</div>';
            return;
        }

        let html = '';
        orders.slice().reverse().forEach((order, idx) => {
            let itemsStr = order.items.map(i => `${i.name} x ${i.qty} ($${(i.price*i.qty).toFixed(2)})`).join(', ');
            html += `
                <div style="background: #f8fafc; border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px;">
                    <div style="display:flex; justify-content:between; font-weight:bold; margin-bottom:5px; color:var(--primary-color);">
                        <span>时间: ${order.time}</span>
                        <span style="color:#25d366;">总计: $${order.grandTotal}美元</span>
                    </div>
                    <div><strong>客户:</strong> ${order.fullName} | <strong>电话/WhatsApp:</strong> ${order.phone} | <strong>邮箱:</strong> ${order.email}</div>
                    <div><strong>地址:</strong> ${order.address}, ${order.city}, ${order.zipCode}, ${order.country}</div>
                    <div><strong>购买商品:</strong> ${itemsStr}</div>
                    <div><strong>支付方式:</strong> ${order.paymentMethod} ${order.txid ? '| <strong>TxID:</strong> ' + order.txid : ''}</div>
                    ${order.notes ? '<div><strong>备注:</strong> ' + order.notes + '</div>' : ''}
                </div>
            `;
        });
        contentDiv.innerHTML = html;
    }

    // 清空历史记录
    function clearOrderHistory() {
        if (confirm("确定要清空所有的历史订单备份记录吗？")) {
            localStorage.removeItem('peptides_order_history');
            renderOrderHistory();
        }
    }

    // 提交订单：同时写入历史记录并拉起 WhatsApp
    function submitDirectCryptoOrder() {
        let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
        if (cart.length === 0) {
            alert("您的购物车是空的！");
            return;
        }

        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const country = document.getElementById('country').value;
        const address = document.getElementById('address').value.trim();
        const city = document.getElementById('city').value.trim();
        const zipCode = document.getElementById('zipCode').value.trim();
        const paymentMethod = document.getElementById('paymentMethod').value;
        const txid = document.getElementById('txid').value.trim();
        const notes = document.getElementById('notes').value.trim();

        var grandTotal = (currentSubtotal + calculatedShipping).toFixed(2);
        var shippingFeeText = calculatedShipping > 0 ? `$${calculatedShipping.toFixed(2)}美元` : "免运费";

        // 1. 保存到本地历史订单 (localStorage)
        const newOrder = {
            time: new Date().toLocaleString(),
            fullName, email, phone, country, address, city, zipCode,
            paymentMethod, txid, notes,
            items: cart,
            subtotal: currentSubtotal.toFixed(2),
            shipping: shippingFeeText,
            grandTotal: grandTotal
        };

        let orderHistory = JSON.parse(localStorage.getItem('peptides_order_history')) || [];
        orderHistory.push(newOrder);
        localStorage.setItem('peptides_order_history', JSON.stringify(orderHistory));

        // 2. 拼接 WhatsApp 消息并跳转
        let itemsText = "";
        cart.forEach(item => {
            itemsText += `• ${item.name} x ${item.qty} ($${(item.price * item.qty).toFixed(2)}美元)\n`;
        });

        let message = `🛒 *NEW ORDER - PeptidesFactoryCN*\n`;
        message += `------------------------------------\n`;
        message += `*Customer Info:*\n`;
        message += `• Name: ${fullName}\n`;
        message += `• Email: ${email}\n`;
        message += `• Phone: ${phone}\n\n`;
        message += `*Shipping Address:*\n`;
        message += `${address}\n${city}, ${zipCode}, ${country}\n\n`;
        message += `*Order Items:*\n${itemsText}\n`;
        message += `• Subtotal: $${currentSubtotal.toFixed(2)}美元\n`;
        message += `• Shipping: ${shippingFeeText}\n`;
        message += `• *Grand Total: $${grandTotal}美元*\n\n`;
        message += `*Payment Method:* ${paymentMethod}\n`;
        if (txid) {
            message += `*TxID / Hash:* ${txid}\n`;
        }
        if (notes) {
            message += `*Notes:* ${notes}\n`;
        }
        message += `------------------------------------\n`;
        message += `Please confirm order details and provide shipping tracking once dispatched.`;

        const encodedMessage = encodeURIComponent(message);
        const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

        window.open(waUrl, '_blank');

        alert('订单已成功提交并在本地存档！正在为您跳转至 WhatsApp...');
        localStorage.removeItem('peptides_cart');
        location.reload();
    }
</script>

</body>
</html>
